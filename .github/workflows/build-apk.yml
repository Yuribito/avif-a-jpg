
name: Crear APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: unzip -q avif2jpg-android.zip -d .

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools
          platforms;android-35
          build-tools;35.0.0'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug
        working-directory: avif2jpg

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: AVIF-a-JPG-APK
          path: avif2jpg/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
